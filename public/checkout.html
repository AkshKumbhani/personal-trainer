<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Checkout - Personal Trainer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="index.css">
  
  <!-- Stripe JS -->
  <script src="https://js.stripe.com/v3/"></script>
</head>

<body class="checkout-page">
  <div class="top-offer">
    10% Discount On The First Order In Dietary!
  </div>

  <!-- NAVBAR -->
  <header class="checkout-header">
    <div class="container-fluid">
      <h1 class="store-name">Personaltrainer WorkDo</h1>
      <a href="cart.html" class="checkout-cart-icon">
        <i class="fa-solid fa-bag-shopping"></i>
      </a>
    </div>
  </header>

  <main class="checkout-container">
    <!-- LEFT: FORM -->
  <div class="checkout-wrapper">
    <!-- LEFT: FORM -->
    <div class="checkout-left">
      <div class="checkout-section">
        <div style="display: flex; justify-content: space-between; align-items: baseline;">
          <h3>Contact</h3>
          <a href="login.html" style="font-size: 13px; color: #1a73e8; text-decoration: underline;">Sign in</a>
        </div>
        <form class="checkout-form">
          <div class="form-group">
            <label>Email or mobile phone number</label>
            <input type="text" id="chkEmail" placeholder="Email" required>
          </div>
          <div style="margin-top: 15px;">
            <input type="checkbox" id="news" style="width: auto;">
            <label for="news" style="display: inline; margin-left: 10px;">Email me with news and offers</label>
          </div>
        </form>
      </div>

      <div class="checkout-section">
        <h3>Delivery</h3>
        <form class="checkout-form">
          <div class="form-group" style="margin-bottom: 20px;">
            <label>Country/Region</label>
            <select id="chkCountry">
              <option value="India">India</option>
              <option value="United States">United States</option>
              <option value="United Kingdom">United Kingdom</option>
            </select>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>First name (optional)</label>
              <input type="text" id="chkFirstName" placeholder="First Name">
            </div>
            <div class="form-group">
              <label>Last name</label>
              <input type="text" id="chkLastName" placeholder="Last Name">
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 20px; position: relative;">
            <label>Address</label>
            <input type="text" id="chkAddress" placeholder="Address" style="padding-right: 40px;">
            <i class="fa-solid fa-magnifying-glass" style="position: absolute; right: 15px; bottom: 15px; color: #999; font-size: 14px;"></i>
          </div>

          <div class="form-group" style="margin-bottom: 20px;">
            <label>Apartment, suite, etc. (optional)</label>
            <input type="text" id="chkApartment" placeholder="Apartment, suite, etc.">
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>City</label>
              <input type="text" id="chkCity" placeholder="City">
            </div>
            <div class="form-group">
              <label>State</label>
              <select id="chkState">
                <option value="">Select State</option>
                <option value="Gujarat">Gujarat</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Delhi">Delhi</option>
              </select>
            </div>
            <div class="form-group">
              <label>PIN code</label>
              <input type="text" id="chkPinCode" placeholder="PIN code">
            </div>
          </div>

          <div style="margin-top: 15px;">
            <input type="checkbox" id="chkSaveInfo" style="width: auto;">
            <label for="chkSaveInfo" style="display: inline; margin-left: 10px;">Save this information for next time</label>
          </div>
        </form>
      </div>

      <div class="checkout-section">
        <h3>Shipping method</h3>
        <div style="border: 1px solid #d9d9d9; padding: 20px; border-radius: 4px; display: flex; justify-content: space-between; background: #f9f9f9;">
          <span style="font-weight: 500;">Standard</span>
          <span style="font-weight: 700;">FREE</span>
        </div>
      </div>

      <div class="checkout-section">
        <h3>Payment</h3>
        <p style="color: #666; font-size: 13px;">All transactions are secure and encrypted.</p>
        
        <div class="payment-methods-grid">
          <!-- COD -->
          <div class="payment-method-item">
            <input type="radio" name="paymentMethod" id="cod" value="COD" checked>
            <label for="cod">
              <div class="pm-info">
                <strong>Cash on Delivery (COD)</strong>
                <span>Pay when you receive the product</span>
              </div>
              <i class="fa-solid fa-money-bill-wave"></i>
            </label>
          </div>

          <!-- STRIPE -->
          <div class="payment-method-item">
            <input type="radio" name="paymentMethod" id="stripe" value="STRIPE">
            <label for="stripe">
              <div class="pm-info">
                <strong>Pay with Stripe</strong>
                <span>Secure payment via Credit/Debit card</span>
              </div>
              <div class="pm-icons">
                <i class="fa-brands fa-cc-visa"></i>
                <i class="fa-brands fa-cc-mastercard"></i>
                <i class="fa-brands fa-cc-amex"></i>
              </div>
            </label>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: ORDER SUMMARY -->
    <aside class="checkout-right" id="checkoutSummary">
      <div id="checkoutItemsList" class="summary-items" style="position: relative;">
        <!-- JS populated items -->
      </div>

      <div class="summary-totals">
        <div class="total-row">
          <span>Subtotal · <span id="checkoutTotalItems">0</span> items</span>
          <span id="checkoutSubtotal">₹0.00</span>
        </div>
        <div class="total-row">
          <span>Shipping</span>
          <span style="font-weight: 600;">FREE</span>
        </div>
        <div class="total-row">
          <span>Estimated taxes <i class="fa-regular fa-circle-question" style="font-size: 11px; cursor: help;"></i></span>
          <span id="checkoutTaxes">₹0.00</span>
        </div>
        <div class="total-row grand-total">
          <span class="total-label">Total<br><span style="font-size: 13px; font-weight: 400; color: #666;">Including <span id="checkoutTaxTotal">₹0.00</span> in taxes</span></span>
          <span style="display: flex; align-items: baseline; gap: 8px;">
            <span class="currency-code">INR</span>
            <span id="checkoutGrandTotal" class="total-val">₹0.00</span>
          </span>
        </div>
      </div>

      <button class="btn-pay" onclick="handlePayment()">PAY NOW</button>
    </aside>
  </div>
  </main>

  <script src="js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      if (typeof updateCheckoutUI === 'function') {
        updateCheckoutUI();
      }

      // AUTO-FILL LOGIC
      const loggedInUser = JSON.parse(localStorage.getItem('user'));
      if (loggedInUser && loggedInUser.id) {
          try {
              const res = await fetch('/api/auth/me', {
                  headers: { 'Authorization': `Bearer ${localStorage.getItem('authToken') || ''}` }
              });
              const result = await res.json();
              if (result.success && result.user) {
                  const u = result.user;
                  document.getElementById('chkEmail').value = u.email || '';
                  document.getElementById('chkFirstName').value = u.first_name || '';
                  document.getElementById('chkLastName').value = u.last_name || '';
                  
                  // Address fields
                  if (u.country) document.getElementById('chkCountry').value = u.country;
                  if (u.address_line) document.getElementById('chkAddress').value = u.address_line;
                  if (u.apartment) document.getElementById('chkApartment').value = u.apartment;
                  if (u.city) document.getElementById('chkCity').value = u.city;
                  if (u.state) document.getElementById('chkState').value = u.state;
                  if (u.pin_code) document.getElementById('chkPinCode').value = u.pin_code;
              }
          } catch (err) {
              console.error('Error fetching user info:', err);
          }
      }
    });

    async function handlePayment() {
      const selectedMethod = document.querySelector('input[name="paymentMethod"]:checked').value;
      const cartData = JSON.parse(localStorage.getItem('cartData')) || [];
      const loggedInUser = JSON.parse(localStorage.getItem('user'));
      
      if (cartData.length === 0) {
        alert('Your cart is empty!');
        return;
      }

      // SAVE ADDRESS LOGIC
      if (document.getElementById('chkSaveInfo').checked && loggedInUser) {
          const addressData = {
              country: document.getElementById('chkCountry').value,
              address_line: document.getElementById('chkAddress').value,
              apartment: document.getElementById('chkApartment').value,
              city: document.getElementById('chkCity').value,
              state: document.getElementById('chkState').value,
              pin_code: document.getElementById('chkPinCode').value
          };
          
          try {
              await fetch('/api/auth/save-address', {
                  method: 'POST',
                  headers: {
                      'Content-Type': 'application/json',
                      'Authorization': `Bearer ${localStorage.getItem('authToken') || ''}`
                  },
                  body: JSON.stringify({ addressData })
              });
          } catch (err) {
              console.error('Error saving address:', err);
          }
      }

      if (selectedMethod === 'COD') {
        alert('Order placed successfully with Cash on Delivery!');
        localStorage.removeItem('cartData');
        window.location.href = 'success.html';
      } else if (selectedMethod === 'STRIPE') {
        try {
          const configResponse = await fetch('/api/config/stripe-publishable-key');
          const config = await configResponse.json();
          if (!configResponse.ok || !config.publishableKey) {
            throw new Error(config.error || 'Stripe is not configured');
          }
          const stripe = Stripe(config.publishableKey);

          const response = await fetch('/api/payment/create-checkout-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                items: cartData,
                customer_email: document.getElementById('chkEmail').value 
            })
          });

          const session = await response.json();
          
          if (session.id) {
            const result = await stripe.redirectToCheckout({
              sessionId: session.id,
            });
            if (result.error) alert(result.error.message);
          } else {
            alert('Could not start Stripe session. Check backend.');
          }
        } catch (err) {
          console.error('Payment Error:', err);
          alert('Something went wrong during payment.');
        }
      }
    }
  </script>
</body>

</html>
