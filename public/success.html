<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Order Successful - Personal Trainer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="index.css">
  <style>
    .success-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .success-icon {
      font-size: 80px;
      color: #ccff00;
      margin-bottom: 20px;
    }
    .btn-home {
      background: #ccff00;
      color: #000;
      font-weight: 700;
      padding: 12px 30px;
      text-decoration: none;
      margin-top: 30px;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-black text-white">
  <div class="success-container">
    <div class="success-icon">
      <i class="fa-solid fa-circle-check"></i>
    </div>
    <h1 style="font-size: 48px; font-weight: 800; margin-bottom: 10px;">ORDER SUCCESSFUL!</h1>
    <p style="font-size: 18px; color: #888;">Thank you for your purchase. Your order has been placed successfully.</p>
    <p id="orderRef" style="font-size: 14px; color: #555; margin-top: 10px;"></p>
    
    <a href="index.html" class="btn-home">CONTINUE SHOPPING</a>
  </div>

  <script>
    // If coming from Stripe, clear cart
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('session_id')) {
        localStorage.removeItem('cartData');
        document.getElementById('orderRef').innerText = 'Transaction Reference: ' + urlParams.get('session_id');
    }
  </script>
</body>
</html>
