<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verify OTP - Personal Trainer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="index.css">
</head>
<body class="bg-black text-white">
  <section class="account-page-section">
    <div class="container">
      <h1 class="account-page-title">VERIFY OTP</h1>
      <div class="account-form-wrapper" style="max-width: 500px; margin: 0 auto;">
        <div class="account-form-header">
          <h3>Enter 6-Digit Code</h3>
        </div>
        <div class="account-form-body text-center">
          <p>We've sent a verification code to your email. Please enter it below.</p>
          <div class="form-group mb-4">
            <input type="text" id="otpPageInput" class="account-input text-center fs-1" maxlength="6" placeholder="000000" style="letter-spacing: 15px; background: #111; color: #ccff00; border: 2px solid #333;">
          </div>
          <div id="otpPageError" class="text-danger mb-3" style="display: none;"></div>
          <button id="verifyPageOtpBtn" class="btn-account w-100">Verify & Login <i class="fa-solid fa-arrow-right"></i></button>
          
          <div class="mt-4">
            <a href="login.html" class="text-decoration-none" style="color: #888;">Back to Login</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
